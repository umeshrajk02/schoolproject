name: CI Pipeline

on:
  push:
    branches: [ "main", "dev" ]
    

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install dependencies
      run: |
        cd backend
        npm install

    - name: Run app check
      run: |
        cd backend
        node index.js &
        sleep 5
        curl http://localhost:3000

    - name: Build Docker image
      run: |
        cd backend
        docker build -t marksheet-backend .

        - name: Login to Docker Hub
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    - name: Tag image
      run: docker tag marksheet-backend ${{ secrets.DOCKER_USERNAME }}/marksheet-backend:latest

    - name: Push image
      run: docker push ${{ secrets.DOCKER_USERNAME }}/marksheet-backend:latest